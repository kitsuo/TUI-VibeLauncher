apply plugin: 'com.android.application'

android {
    namespace "ohi.andre.consolelauncher"
    compileSdk 35

    def keystorePropertiesFile = rootProject.file("local.properties")
    def keystoreProperties = new Properties()
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }

    // Only sign with the release keystore when it actually exists, so a fresh clone can still build
    def releaseKeystore = file("../" + (keystoreProperties["storeFile"] ?: "release.jks"))
    def hasReleaseKeystore = releaseKeystore.exists()

    signingConfigs {
        release {
            storeFile file("../" + (keystoreProperties["storeFile"] ?: "release.jks"))
            storePassword = keystoreProperties["storePassword"] ?: ""
            keyAlias = keystoreProperties["keyAlias"] ?: "tui-alias"
            keyPassword = keystoreProperties["keyPassword"] ?: ""
        }
    }

    defaultConfig {
        applicationId "ohi.andre.consolelauncher"
        minSdk 21
        targetSdk 35
        versionCode 304
        versionName "6.15.1-vibe.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            if (hasReleaseKeystore) signingConfig signingConfigs.release
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    productFlavors {
        flavorDimensions = ["default"]
        fdroid {
            dimension "default"
        }
        playstore {
            dimension "default"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
    }

    packaging {
        resources {
            // multi-release classes of jsch / bouncy castle target newer desktop JVMs and are never used on Android
            excludes += ['META-INF/versions/**']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'net.sourceforge.htmlcleaner:htmlcleaner:2.29'
    implementation 'com.jayway.jsonpath:json-path:2.9.0'
    implementation 'org.jsoup:jsoup:1.17.2'
    implementation 'it.andreuzzi:CompareString2:1.0.9'

    // ssh client (pure Java) + Bouncy Castle for ed25519 / curve25519, which Android's crypto provider lacks
    implementation 'com.github.mwiede:jsch:2.28.8'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
}
